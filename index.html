<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=1920, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <title>Story Time Universe</title>
    <style>
      /* Static boot frame — visible before JS mounts, and if the bundle fails
         on very old Chromium (so QA never sees a mysterious void black screen). */
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000000;
        color: #f5f5f5;
        font-family: "LG Smart UI", "Roboto", "Segoe UI", sans-serif;
      }
      #root { width: 100%; height: 100%; }
      #boot-splash {
        position: absolute;
        top: 0; right: 0; bottom: 0; left: 0;
        display: -webkit-box;
        display: -webkit-flex;
        display: flex;
        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -webkit-flex-direction: column;
        flex-direction: column;
        -webkit-box-align: center;
        -webkit-align-items: center;
        align-items: center;
        -webkit-box-pack: center;
        -webkit-justify-content: center;
        justify-content: center;
        background: #000000;
        z-index: 1;
        pointer-events: none;
      }
      #boot-splash .mark {
        font-size: 72px;
        font-weight: 800;
        letter-spacing: 4px;
        color: #ff931f;
      }
      #boot-splash .label {
        margin-top: 18px;
        font-size: 22px;
        color: #9e9e9e;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="mark">S.T</div>
      <div class="label">Loading</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
